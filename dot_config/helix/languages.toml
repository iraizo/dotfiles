
[[language]]
name = "git-config"
# scope = "source.git-conf"
file-types = ["conf"]

[[language]]
name = "rust"
auto-format = true

roots = [
  "Cargo.toml",
  "Cargo.lock"
]

[language.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
'`' = '`'

[language-server.rust-analyzer]
command = "rust-analyzer"

[language-server.rust-analyzer.config]
check.command = "clippy"
inlayHints.bindingModeHints.enable = false
inlayHints.closingBraceHints.minLines = 10
inlayHints.closureReturnTypeHints.enable = "with_block"
inlayHints.discriminantHints.enable = "fieldless"
inlayHints.lifetimeElisionHints.enable = "skip_trivial"
inlayHints.typeHints.hideClosureInitialization = false

[[language]]
name = "fish"
language-servers = [ "fish-lsp" ]

[language-server.fish-lsp]
command = "fish-lsp"
args= ["start"]
environment = { "fish_lsp_show_client_popups" = "false" }

[language-server.typescript-lsp]
command = "bunx --bun typescript-language-server --stdio"

[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]

[language-server.oxlint-lsp]
command = "oxlint"
args = ["--lsp"]

[[language]]
name = "html"
language-servers = [ "superhtml", "tailwindcss-ls"]
formatter = { command = "superhtml", args = ["fmt", "--stdin"] }
auto-format = true

[[language]]
name = "css"
language-servers = [ "vscode-css-language-server", "tailwindcss-ls"]
formatter = { command = "oxfmt", args = ["--stdin-filepath=pluh.css"] }
auto-format = true

[[language]]
name = "typescript"
language-servers = ["typescript-language-server", "oxlint-lsp"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "pluh.ts"] }
auto-format = true

[[language]]
name = "markdown"
language-servers = ["markdown-oxide", "mpls"]
formatter = { command = "dprint", args = [ "fmt", "--stdin", "markdown" ] }
auto-format = true

[language-server.mpls]
command = "mpls"
args = ["--theme", "tokyonight", "--enable-emoji", "--browser", "firefox-developer-edition"]
