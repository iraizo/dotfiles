[[language]]
name = "julia"
scope = "source.julia"
injection-regex = "julia"
file-types = ["jl"]
roots = ["Project.toml", "Manifest.toml", "JuliaProject.toml"]
comment-token = "#"
language-servers = ["julia-lsp"]
indent = { tab-width = 4, unit = "    " }

[language.formatter]
command = "julia"
args = [
    "--project=@JuliaFormatter",
    "--startup-file=no",
    "--history-file=no",
    "--quiet",
    "-J/home/raizo/.julia/environments/JuliaFormatter/juliaformatter.so",
    "--sysimage-native-code=yes",
    "-e",
    "using JuliaFormatter; print(format_text(read(stdin, String); Dict{Symbol,Any}(Symbol(k) => v for (k, v) in JuliaFormatter.find_config_file(realpath(\".\")))...))",
]

[language-server.julia-lsp]
command = "julia"
timeout = 60
args = [
    "--project=@LanguageServer",
    "--startup-file=no",
    "--history-file=no",
    "--quiet",
    "-J/home/raizo/.julia/environments/LanguageServer/languageserver.so",
    "--sysimage-native-code=yes",
    "-e",
    """
import Pkg
project_path = let
    dirname(something(
        Base.load_path_expand((
            p = get(ENV, "JULIA_PROJECT", nothing);
            isnothing(p) ? nothing : isempty(p) ? nothing : p
        )),
        Base.current_project(pwd()),
        Pkg.Types.Context().env.project_file,
        Base.active_project(),
    ))
    end
ls_install_path = joinpath(get(DEPOT_PATH, 1, joinpath(homedir(), ".julia")), "environments", "LanguageServer");
pushfirst!(LOAD_PATH, ls_install_path);
using LanguageServer;
popfirst!(LOAD_PATH);
depot_path = get(ENV, "JULIA_DEPOT_PATH", "")
symbol_server_path = joinpath(homedir(), ".cache", "helix", "julia_lsp_symbol_server")
mkpath(symbol_server_path)
server = LanguageServer.LanguageServerInstance(stdin, stdout, project_path, depot_path, nothing, symbol_server_path, true)
server.runlinter = true
run(server)
"""]

[[language]]
name = "typst"
language-servers = ["scls", "tinymist"]
auto-format = true
formatter.command = "typstyle"

[language-server.tinymist]
command = "tinymist"
config = { exportPdf = "onType"}

[language-server.lua-language-server]
command = "lua-language-server"

[language-server.lua-language-server.config.Lua.hint]
enable = true

[language-server.lua-language-server.config.Lua.workspace]
library = [
  "/home/raizo/.local/share/lux/tree/5.5/8c1f1582b6a8d805870cd4abff3347acca2d8c515a5a1ffdbcfe44c885f64349-wezterm-types@3.4.0-1/src",
]

[[language]]
name = "lua"
language-servers = ["lua-language-server"]
auto-format = true
formatter = { command = "stylua", args = ["--search-parent-directories", "-"] }
